<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Outfit Builder</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="layout">
    <aside class="panel" aria-label="Outfit colors">
      <div class="groups" id="panel"></div>
      <button type="button" class="random" id="random" hidden>Surprise me</button>
    </aside>
    <section class="stage">
      <div class="frame">
        <canvas id="canvas" aria-label="Outfit preview"></canvas>
        <p class="loading" id="loading">Loading…</p>
      </div>
      <p class="summary" id="summary"></p>
    </section>
  </main>
  <dialog class="shop-dialog" id="shop-dialog" aria-labelledby="shop-title">
    <div class="shop-head">
      <h2 id="shop-title"></h2>
      <form method="dialog"><button class="shop-close" aria-label="Close">×</button></form>
    </div>
    <div class="shop-body" id="shop-body"></div>
  </dialog>
  <script src="app.js"></script>
</body>
</html>
