<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Outfit Builder</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="layout">
    <aside class="panel" id="panel" aria-label="Outfit colors"></aside>
    <section class="stage">
      <div class="frame">
        <canvas id="canvas" aria-label="Outfit preview"></canvas>
        <p class="loading" id="loading">Loading…</p>
      </div>
      <p class="summary" id="summary"></p>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
